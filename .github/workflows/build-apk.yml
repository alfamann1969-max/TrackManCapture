name: Build TrackMan Capture APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 17 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android-Projekt suchen
        id: find_project
        shell: bash
        run: |
          echo "Dateien im Repository:"
          find . -maxdepth 4 -type f | sort | head -300

          PROJECT_DIR=$(find . -name "settings.gradle.kts" -o -name "settings.gradle" | head -1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "FEHLER: Keine settings.gradle oder settings.gradle.kts gefunden."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")
          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "Android-Projekt gefunden in: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: APK bauen
        shell: bash
        run: |
          PROJECT="${{ steps.find_project.outputs.project_dir }}"
          echo "Baue Projekt in: $PROJECT"
          gradle -p "$PROJECT" :app:assembleDebug --no-daemon

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: TrackMan-Capture-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          retention-days: 14
