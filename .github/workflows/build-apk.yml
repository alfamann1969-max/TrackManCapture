name: Build TrackMan Capture APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Java 17 installieren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: ZIP entpacken
        shell: bash
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'TrackManCapture_*_GitHubReady.zip' | sort -V | tail -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "FEHLER: Keine TrackManCapture-ZIP gefunden."
            exit 1
          fi

          echo "Verwende ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d project

          echo "Projektdateien:"
          find project -maxdepth 3 -type f | sort

      - name: APK bauen
        shell: bash
        run: |
          gradle -p project :app:assembleDebug --no-daemon

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: TrackMan-Capture-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
